<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1-Back & 2-Back Task</title>
    <!-- jsPsych v7.3 -->
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.1"></script>
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f8f9fa;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        #jspsych-target {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .jspsych-display-element {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center !important; 
            width: 100%;
            height: 100%;
            transition: none; /* 震え防止 */
        }

        /* 結果画面などで中央寄せを解除し、震えを防止するためのクラス */
        .jspsych-display-element.show-results {
            justify-content: flex-start !important;
            overflow-y: auto !important;
            display: block !important; /* Flexによる再計算を抑止 */
            padding: 20px 0;
        }

        .jspsych-content-wrapper {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        /* 刺激提示コンテナ */
        .stimulus-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .stimulus {
            font-size: clamp(80px, 25vw, 120px); 
            font-weight: bold;
            margin: 10px 0;
            color: #2c3e50;
            user-select: none;
            height: 1.2em;
            display: flex;
            align-items: center;
        }

        .guide {
            color: #7f8c8d;
            font-size: clamp(0.8rem, 3vw, 1rem);
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            width: 90%;
            text-align: center;
            line-height: 1.4;
        }

        /* ボタンデザイン */
        .jspsych-btn {
            font-size: clamp(1rem, 4vw, 1.4rem) !important;
            padding: 12px 30px !important;
            margin: 8px !important;
            border-radius: 12px !important;
            background-color: #ffffff !important;
            border: 2px solid #2c3e50 !important;
            color: #2c3e50 !important;
            font-weight: bold !important;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        
        .jspsych-btn:hover { background-color: #f0f0f0 !important; }
        .jspsych-btn:active { background-color: #2c3e50 !important; color: #ffffff !important; transform: scale(0.95); }

        /* 教示画面のスクロール対応 */
        .scrollable-container {
            box-sizing: border-box;
            max-height: 85vh; 
            overflow-y: auto;
            width: 95%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 60px; 
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: left;
            -webkit-overflow-scrolling: touch; 
        }

        /* 結果画面用のスタイル調整：震え防止 */
        .results-container {
            max-height: none !important;
            overflow-y: visible !important;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        .results-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.75rem;
            margin-top: 15px;
        }

        .results-table th {
            position: sticky;
            top: 0;
            background-color: #2c3e50;
            color: white;
            padding: 6px;
            border: 1px solid #ccc;
        }

        .results-table td { border: 1px solid #ccc; padding: 4px; text-align: center; }
        .correct-true { color: #27ae60; font-weight: bold; }
        .correct-false { color: #e74c3c; font-weight: bold; }
        
        /* グラフを縦に並べるための修正 */
        .summary-charts {
            display: flex;
            flex-direction: column; /* 縦並びに変更 */
            gap: 20px;
            margin: 15px 0;
            align-items: center; /* 中央揃え */
        }

        .chart-container {
            width: 100%; /* 幅いっぱい */
            max-width: 600px; /* 最大幅を制限 */
            height: 300px; /* 高さを少し高めに調整 */
            background: #fff;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .interpretation-box {
            background-color: #e3f2fd;
            border-left: 5px solid #2196f3;
            padding: 12px;
            margin: 15px 0;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .alert-box {
            background-color: #fffde7;
            border: 2px solid #fbc02d;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            color: #d32f2f;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .loading-screen {
            text-align: center;
            padding: 30px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .example-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.8rem;
            background: #fdfdfd;
        }
        .example-table th, .example-table td { border: 1px solid #eee; padding: 4px; text-align: center; }
        .example-table th { background: #f1f1f1; }
        
        .instruction-section {
            margin-bottom: 15px;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 10px;
        }
        
        .key-badge {
            display: inline-block;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0 5px;
            font-family: monospace;
            font-weight: bold;
        }

        .jspsych-html-button-response-btngroup {
            margin-top: 20px !important;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        #jspsych-survey-multi-choice-form {
            text-align: left;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyMY3fsqWLfX12i-OXOWVEkWsPFfmp34tLxfyblmdw2HdIb93sOgwx2FoUIrx_WuA8R/exec";

        const jsPsych = initJsPsych({
            display_element: 'jspsych-target'
        });

        // --- 配列生成 ---
        function generateNBackSequence(n, totalTrials = 20, targetCount = 6) {
            const letters = ['A', 'B', 'C', 'D', 'E'];
            let sequence = new Array(totalTrials);
            let targetIndices = [];
            let availableIndices = [];
            for (let i = n; i < totalTrials; i++) availableIndices.push(i);
            for (let i = 0; i < targetCount; i++) {
                const randIdx = Math.floor(Math.random() * availableIndices.length);
                targetIndices.push(availableIndices.splice(randIdx, 1)[0]);
            }
            for (let i = 0; i < totalTrials; i++) {
                if (targetIndices.includes(i)) {
                    sequence[i] = sequence[i - n];
                } else {
                    let possible = letters.slice();
                    if (i >= n) possible = possible.filter(l => l !== sequence[i - n]);
                    sequence[i] = possible[Math.floor(Math.random() * possible.length)];
                }
            }
            return sequence;
        }

        const sequence1Back = generateNBackSequence(1, 20, 6);
        const sequence2Back = generateNBackSequence(2, 20, 6);
        let participantId = "";
        let selectedDevice = "";

        const p_info_id = {
            type: jsPsychSurveyText,
            questions: [{prompt: "参加者IDを入力してください", name: 'p_id', required: true}],
            button_label: "次へ"
        };

        const p_info_device = {
            type: jsPsychSurveyMultiChoice,
            questions: [
                {
                    prompt: "使用しているデバイスを選択してください", 
                    name: 'device', 
                    options: ["パソコン", "スマホ", "タブレット"], 
                    required: true
                }
            ],
            button_label: "実験を始める",
            on_finish: function(data) {
                const last_data = jsPsych.data.get().last(2).values()[0];
                participantId = last_data.response.p_id;
                selectedDevice = data.response.device;
            }
        };

        const instr_1back = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div class="scrollable-container">
                    <h3 style="text-align: center; margin-top: 0;">前半：1-Back課題</h3>
                    
                    <div class="instruction-section">
                        <p><strong>【ルール】</strong><br>
                        表示された文字が、<strong>「1つ前の文字と同じ」</strong>かを判断してください。</p>
                    </div>

                    <div class="instruction-section">
                        <p><strong>【操作方法】</strong><br>
                        状況に合わせて回答してください。</p>
                        <ul>
                            <li><strong>PCキーボード：</strong><br>
                                ・同じとき：<span class="key-badge">F</span> キー<br>
                                ・違うとき：<span class="key-badge">J</span> キー
                            </li>
                            <li style="margin-top:10px;"><strong>スマホ・タップ：</strong><br>
                                ・画面下部の <strong>[同じ]</strong> または <strong>[違う]</strong> ボタンをタップ
                            </li>
                        </ul>
                    </div>

                    <p><strong>【1-Backの例】</strong></p>
                    <table class="example-table">
                        <tr><th>順</th><th>文字</th><th>判断</th><th>正解</th></tr>
                        <tr><td>1</td><td>A</td><td>-</td><td>違う</td></tr>
                        <tr><td>2</td><td>B</td><td>A と違う</td><td>違う</td></tr>
                        <tr><td>3</td><td>B</td><td>B と同じ</td><td><span style="color:#27ae60">同じ</span></td></tr>
                    </table>
                    
                    <div class="alert-box">
                        ⚠️ 1文字目は必ず「違う」を選択してください。<br>
                        ⚠️ 各文字は0.5秒で消えます。消える前に素早く回答してください。
                    </div>
                </div>`,
            choices: ['1-Backを開始する'],
            button_html: '<button class="jspsych-btn">%choice%</button>'
        };

        const instr_2back = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div class="scrollable-container">
                    <h3 style="text-align: center; margin-top: 0;">後半：2-Back課題</h3>
                    <p>ルールが変わります。<strong>「2つ前の文字と同じ」</strong>かを判断してください。</p>
                    
                    <p><strong>【操作方法】</strong>（前半と同じ）<br>
                    ・同じ：<span class="key-badge">F</span> キー または <strong>[同じ]</strong> ボタン<br>
                    ・違う：<span class="key-badge">J</span> キー または <strong>[違う]</strong> ボタン</p>

                    <p><strong>【2-Backの例】</strong></p>
                    <table class="example-table">
                        <tr><th>順</th><th>文字</th><th>比較</th><th>正解</th></tr>
                        <tr><td>1</td><td>A</td><td>-</td><td>違う</td></tr>
                        <tr><td>2</td><td>B</td><td>-</td><td>違う</td></tr>
                        <tr><td>3</td><td>A</td><td>1番目と同じ</td><td><span style="color:#27ae60">同じ</span></td></tr>
                    </table>
                    <div class="alert-box">⚠️ 最初の2文字は必ず「違う」を選んでください。</div>
                </div>`,
            choices: ['2-Backを開始する'],
            button_html: '<button class="jspsych-btn">%choice%</button>'
        };

        const ready_wait = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div style="font-size: 1.5rem; color: #7f8c8d;">まもなく始まります...</div>',
            choices: "NO_KEYS",
            trial_duration: 1500
        };

        function createTrials(sequence, n, conditionName) {
            return sequence.map((letter, index) => {
                const isTarget = index >= n && letter === sequence[index - n];
                const targetLabel = isTarget ? "同じ" : "違う";
                return {
                    type: jsPsychHtmlButtonResponse,
                    stimulus: () => `
                        <div class="stimulus-container">
                            <div class="guide">${n}-Back: <br>同じ → [同じ]ボタン or Fキー，<br>違う→ [違う]ボタン or Jキー</div>
                            <div class="stimulus" id="stim-${conditionName}-${index}">${letter}</div>
                        </div>`,
                    choices: ['同じ', '違う'],
                    button_html: ['<button id="btn-same" class="jspsych-btn">同じ</button>', '<button id="btn-diff" class="jspsych-btn">違う</button>'],
                    on_load: function() {
                        setTimeout(() => {
                            const stimElem = document.getElementById(`stim-${conditionName}-${index}`);
                            if (stimElem) stimElem.style.visibility = 'hidden';
                        }, 500);
                        const handleKey = (e) => {
                            if (e.key.toLowerCase() === 'f') document.getElementById('btn-same').click();
                            else if (e.key.toLowerCase() === 'j') document.getElementById('btn-diff').click();
                        };
                        window.addEventListener('keydown', handleKey);
                        jsPsych.getCurrentTrial()._keyListener = handleKey;
                    },
                    on_finish: function(data) {
                        window.removeEventListener('keydown', jsPsych.getCurrentTrial()._keyListener);
                        let res = data.response === 0 ? "同じ" : (data.response === 1 ? "違う" : "無反応");
                        data.user_response = res;
                        data.correct = (res === targetLabel);
                        data.letter = letter;
                        data.target_label = targetLabel;
                        data.trial_num = index + 1;
                        data.condition = conditionName;
                        data.participant_id = participantId;
                        data.device = selectedDevice;
                    },
                    trial_duration: 2000,
                    response_ends_trial: false
                };
            });
        }

        const save_and_results = {
            type: jsPsychHtmlButtonResponse,
            stimulus: function() {
                return `
                <div class="scrollable-container results-container" id="final-container">
                    <div id="loading-area" class="loading-screen">
                        <div class="spinner"></div>
                        <p>データを送信しています...</p>
                    </div>
                </div>`;
            },
            choices: [],
            on_load: function() {
                // 【震え対策】結果画面では強制的に中央寄せを解除する
                const displayElement = document.querySelector('.jspsych-display-element');
                if (displayElement) {
                    displayElement.classList.add('show-results');
                }

                const all_data = jsPsych.data.get().filterCustom(d => d.condition !== undefined);
                const clean_data = all_data.values().map(trial => {
                    const { stimulus, response, trial_type, internal_node_id, ...rest } = trial;
                    return rest;
                });
                const results_json = JSON.stringify(clean_data);

                fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: results_json
                }).then(() => {
                    renderFinalContent(all_data);
                }).catch(err => {
                    console.error(err);
                    renderFinalContent(all_data);
                });
            }
        };

        function renderFinalContent(all_data) {
            const d1 = all_data.filter({condition: '1-back'}).values();
            const d2 = all_data.filter({condition: '2-back'}).values();

            const calcAcc = (arr) => (arr.filter(v => v.correct).length / arr.length * 100).toFixed(1);
            const calcRT = (arr) => {
                const valid = arr.filter(v => v.rt !== null && v.rt > 0);
                return valid.length > 0 ? (valid.reduce((s, v) => s + v.rt, 0) / valid.length).toFixed(0) : "0";
            };

            const stats = {
                acc1: calcAcc(d1), acc2: calcAcc(d2),
                rt1: calcRT(d1), rt2: calcRT(d2)
            };

            const isHypothesisMet = parseFloat(stats.acc1) >= parseFloat(stats.acc2) && parseFloat(stats.rt1) <= parseFloat(stats.rt2);

            let tableRows = "";
            all_data.values().forEach(d => {
                tableRows += `<tr><td>${d.condition}</td><td>${d.trial_num}</td><td>${d.letter}</td><td>${d.target_label}</td><td>${d.user_response}</td><td class="correct-${d.correct}">${d.correct ? "○" : "×"}</td><td>${d.rt ? Math.round(d.rt) : "-"}</td></tr>`;
            });

            const container = document.getElementById('final-container');
            if (!container) return;

            container.innerHTML = `
                <div style="text-align: center;">
                    <h3 style="color:#27ae60">✅ データ送信完了</h3>
                    <p>ID: <strong>${participantId}</strong> / デバイス: <strong>${selectedDevice}</strong></p>
                </div>

                <div class="summary-charts">
                    <div class="chart-container"><canvas id="accChart"></canvas></div>
                    <div class="chart-container"><canvas id="rtChart"></canvas></div>
                </div>

                <div class="interpretation-box">
                    <h4>📊 解説</h4>
                    <p>仮説との一致: ${isHypothesisMet ? "一致しました" : "不一致でした"}</p>
                    <p>通常、2-Backは脳への負荷が高いため正答率が下がり、反応が遅れます。</p>
                </div>

                <h4>📋 詳細データ</h4>
                <div style="overflow-x:auto">
                    <table class="results-table">
                        <thead><tr><th>条件</th><th>番</th><th>字</th><th>正解</th><th>回答</th><th>果</th><th>RT</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            `;

            new Chart(document.getElementById('accChart'), {
                type: 'bar',
                data: {
                    labels: ['1-Back', '2-Back'],
                    datasets: [{ label: '正解率 (%)', data: [stats.acc1, stats.acc2], backgroundColor: ['#81c784', '#e57373'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
            });

            new Chart(document.getElementById('rtChart'), {
                type: 'bar',
                data: {
                    labels: ['1-Back', '2-Back'],
                    datasets: [{ label: '反応速度 (ms)', data: [stats.rt1, stats.rt2], backgroundColor: ['#64b5f6', '#ffb74d'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        const timeline = [
            p_info_id,
            p_info_device,
            instr_1back, ready_wait, ...createTrials(sequence1Back, 1, '1-back'),
            instr_2back, ready_wait, ...createTrials(sequence2Back, 2, '2-back'),
            save_and_results
        ];
        
        jsPsych.run(timeline);
    </script>
</body>
</html>
