<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-Back & 2-Back Task</title>
    <!-- jsPsych v7.3 -->
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.1"></script>
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f8f9fa;
            line-height: 1.8;
            color: #333;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #jspsych-target {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .jspsych-display-element {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start !important;
            padding: 40px 0;
        }

        .jspsych-content-wrapper {
            width: 100%;
        }

        .stimulus-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .stimulus {
            font-size: 120px;
            font-weight: bold;
            margin: 20px 0;
            color: #2c3e50;
            user-select: none;
            height: 150px;
            display: flex;
            align-items: center;
        }

        .guide {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 30px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
        }

        .jspsych-btn {
            font-size: 1.4rem !important;
            padding: 15px 40px !important;
            margin: 10px !important;
            border-radius: 12px !important;
            background-color: #ffffff !important;
            border: 2px solid #2c3e50 !important;
            color: #2c3e50 !important;
            font-weight: bold !important;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .jspsych-btn:hover { background-color: #f0f0f0 !important; }
        .jspsych-btn:active { background-color: #2c3e50 !important; color: #ffffff !important; transform: scale(0.95); }

        .scrollable-container {
            max-height: 80vh;
            overflow-y: auto;
            width: 95%;
            max-width: 850px;
            margin: 0 auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: left;
        }

        .results-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.8rem;
            margin-top: 20px;
        }

        .results-table th {
            position: sticky;
            top: 0;
            background-color: #2c3e50;
            color: white;
            padding: 8px;
            border: 1px solid #ccc;
        }

        .results-table td { border: 1px solid #ccc; padding: 6px; text-align: center; }
        .correct-true { color: #27ae60; font-weight: bold; }
        .correct-false { color: #e74c3c; font-weight: bold; }
        
        .summary-charts {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
            justify-content: center;
        }

        .chart-container {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            height: 300px;
            background: #fff;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .interpretation-box {
            background-color: #e3f2fd;
            border-left: 5px solid #2196f3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .alert-box {
            background-color: #fffde7;
            border: 2px solid #fbc02d;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #d32f2f;
            font-weight: bold;
        }

        .loading-screen {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .example-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 0.85rem;
            background: #fdfdfd;
        }
        .example-table th, .example-table td { border: 1px solid #eee; padding: 5px; text-align: center; }
        .example-table th { background: #f1f1f1; }
        
        .instruction-section {
            margin-bottom: 20px;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 15px;
        }
        
        .key-badge {
            display: inline-block;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0 6px;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyMY3fsqWLfX12i-OXOWVEkWsPFfmp34tLxfyblmdw2HdIb93sOgwx2FoUIrx_WuA8R/exec";

        const jsPsych = initJsPsych({
            display_element: 'jspsych-target'
        });

        // --- 配列生成 ---
        function generateNBackSequence(n, totalTrials = 20, targetCount = 6) {
            const letters = ['A', 'B', 'C', 'D', 'E'];
            let sequence = new Array(totalTrials);
            let targetIndices = [];
            let availableIndices = [];
            for (let i = n; i < totalTrials; i++) availableIndices.push(i);
            for (let i = 0; i < targetCount; i++) {
                const randIdx = Math.floor(Math.random() * availableIndices.length);
                targetIndices.push(availableIndices.splice(randIdx, 1)[0]);
            }
            for (let i = 0; i < totalTrials; i++) {
                if (targetIndices.includes(i)) {
                    sequence[i] = sequence[i - n];
                } else {
                    let possible = letters.slice();
                    if (i >= n) possible = possible.filter(l => l !== sequence[i - n]);
                    sequence[i] = possible[Math.floor(Math.random() * possible.length)];
                }
            }
            return sequence;
        }

        const sequence1Back = generateNBackSequence(1, 20, 6);
        const sequence2Back = generateNBackSequence(2, 20, 6);
        let participantId = "";

        // --- 参加者情報入力 ---
        const p_info = {
            type: jsPsychSurveyText,
            questions: [{prompt: "参加者ID（またはお名前）を入力してください", name: 'p_id', required: true}],
            button_label: "実験を始める",
            on_finish: function(data) { participantId = data.response.p_id; }
        };

        // --- 教示 ---
        const instr_1back = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div class="scrollable-container">
                    <h3 style="text-align: center;">前半：1-Back課題</h3>
                    
                    <div class="instruction-section">
                        <p><strong>【ルール】</strong><br>
                        表示された文字が、<strong>「1つ前の文字と同じ」</strong>かを判断してください。</p>
                    </div>

                    <div class="instruction-section">
                        <p><strong>【操作方法】</strong><br>
                        使用しているデバイスに合わせて、以下のいずれかで回答してください。</p>
                        <ul>
                            <li><strong>PC（キーボード）で操作する場合：</strong><br>
                                ・同じとき：<span class="key-badge">F</span> キーを押す<br>
                                ・違うとき：<span class="key-badge">J</span> キーを押す
                            </li>
                            <li style="margin-top:10px;"><strong>スマホ・タブレット（画面タップ）で操作する場合：</strong><br>
                                ・画面下部に表示される <strong>[同じ]</strong> または <strong>[違う]</strong> ボタンを直接タップしてください。
                            </li>
                        </ul>
                    </div>

                    <p><strong>【1-Backの例】</strong></p>
                    <table class="example-table">
                        <tr><th>順</th><th>文字</th><th>判断</th><th>正解</th></tr>
                        <tr><td>1</td><td>A</td><td>（比較対象なし）</td><td>違う</td></tr>
                        <tr><td>2</td><td>B</td><td>A と違う</td><td>違う</td></tr>
                        <tr><td>3</td><td>B</td><td>B と同じ</td><td><span style="color:#27ae60">同じ</span></td></tr>
                    </table>
                    
                    <div class="alert-box">
                        ⚠️ 1文字目は比較する相手がいないため、必ず「違う」を選択してください。<br>
                        ⚠️ 各文字は一定時間で消えます。消える前に素早く回答してください。
                    </div>
                </div>`,
            choices: ['理解しました。1-Backを開始する'],
            button_html: '<button class="jspsych-btn">%choice%</button>'
        };

        const instr_2back = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div class="scrollable-container">
                    <h3 style="text-align: center;">後半：2-Back課題</h3>
                    <p>ルールが変わります。<strong>「2つ前の文字と同じ」</strong>かを判断してください。</p>
                    
                    <p><strong>【操作方法】（前半と同じです）</strong><br>
                    ・同じとき：<span class="key-badge">F</span> キー または <strong>[同じ]</strong> ボタン<br>
                    ・違うとき：<span class="key-badge">J</span> キー または <strong>[違う]</strong> ボタン</p>

                    <p><strong>【2-Backの例】</strong></p>
                    <table class="example-table">
                        <tr><th>順</th><th>文字</th><th>比較対象</th><th>正解</th></tr>
                        <tr><td>1</td><td>A</td><td>なし</td><td>違う</td></tr>
                        <tr><td>2</td><td>B</td><td>なし</td><td>違う</td></tr>
                        <tr><td>3</td><td>A</td><td>1番目の A と同じ</td><td><span style="color:#27ae60">同じ</span></td></tr>
                    </table>
                    <div class="alert-box">⚠️ 最初の2文字は比較対象がありませんので、必ず「違う」を選んでください。</div>
                </div>`,
            choices: ['2-Backを開始する'],
            button_html: '<button class="jspsych-btn">%choice%</button>'
        };

        const ready_wait = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div style="font-size: 2rem; color: #7f8c8d;">まもなく始まります...</div>',
            choices: "NO_KEYS",
            trial_duration: 1500
        };

        // --- 試行生成 ---
        function createTrials(sequence, n, conditionName) {
            return sequence.map((letter, index) => {
                const isTarget = index >= n && letter === sequence[index - n];
                const targetLabel = isTarget ? "同じ" : "違う";
                return {
                    type: jsPsychHtmlButtonResponse,
                    stimulus: () => `
                        <div class="stimulus-container">
                            <div class="guide">${n}-Back: 同じ → [同じ]ボタン or Fキー，違う→ [違う]ボタン or Jキー</div>
                            <div class="stimulus" id="stim-${conditionName}-${index}">${letter}</div>
                        </div>`,
                    choices: ['同じ', '違う'],
                    button_html: ['<button id="btn-same" class="jspsych-btn">同じ</button>', '<button id="btn-diff" class="jspsych-btn">違う</button>'],
                    on_load: function() {
                        setTimeout(() => {
                            const stimElem = document.getElementById(`stim-${conditionName}-${index}`);
                            if (stimElem) stimElem.style.visibility = 'hidden';
                        }, 500);
                        const handleKey = (e) => {
                            if (e.key.toLowerCase() === 'f') document.getElementById('btn-same').click();
                            else if (e.key.toLowerCase() === 'j') document.getElementById('btn-diff').click();
                        };
                        window.addEventListener('keydown', handleKey);
                        jsPsych.getCurrentTrial()._keyListener = handleKey;
                    },
                    on_finish: function(data) {
                        window.removeEventListener('keydown', jsPsych.getCurrentTrial()._keyListener);
                        let res = data.response === 0 ? "同じ" : (data.response === 1 ? "違う" : "無反応");
                        data.user_response = res;
                        data.correct = (res === targetLabel);
                        data.letter = letter;
                        data.target_label = targetLabel;
                        data.trial_num = index + 1;
                        data.condition = conditionName;
                        data.participant_id = participantId;
                    },
                    trial_duration: 2000,
                    response_ends_trial: false
                };
            });
        }

        // --- データ送信 & 結果表示 ---
        const save_and_results = {
            type: jsPsychHtmlButtonResponse,
            stimulus: function() {
                return `
                <div class="scrollable-container" id="final-container">
                    <div id="loading-area" class="loading-screen">
                        <div class="spinner"></div>
                        <p>データを送信しています。しばらくお待ちください...</p>
                    </div>
                </div>`;
            },
            choices: [],
            on_load: function() {
                // 送信用データの作成：不要なプロパティを削除
                const all_data = jsPsych.data.get().filterCustom(d => d.condition !== undefined);
                
                // 特定のキーを削除したクリーンなデータ配列を作成
                const clean_data = all_data.values().map(trial => {
                    const { stimulus, response, trial_type, internal_node_id, ...rest } = trial;
                    return rest;
                });

                const results_json = JSON.stringify(clean_data);

                // GASへ送信
                fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: results_json
                }).then(() => {
                    renderFinalContent(all_data);
                }).catch(err => {
                    console.error(err);
                    renderFinalContent(all_data); // 失敗しても表示は行う
                });
            }
        };

        function renderFinalContent(all_data) {
            const d1 = all_data.filter({condition: '1-back'}).values();
            const d2 = all_data.filter({condition: '2-back'}).values();

            const calcAcc = (arr) => (arr.filter(v => v.correct).length / arr.length * 100).toFixed(1);
            const calcRT = (arr) => {
                const valid = arr.filter(v => v.rt !== null && v.rt > 0);
                return (valid.reduce((s, v) => s + v.rt, 0) / valid.length).toFixed(0);
            };

            const stats = {
                acc1: calcAcc(d1), acc2: calcAcc(d2),
                rt1: calcRT(d1), rt2: calcRT(d2)
            };

            const isHypothesisMet = parseFloat(stats.acc1) >= parseFloat(stats.acc2) && parseFloat(stats.rt1) <= parseFloat(stats.rt2);

            let tableRows = "";
            all_data.values().forEach(d => {
                tableRows += `<tr><td>${d.condition}</td><td>${d.trial_num}</td><td style="font-weight:bold">${d.letter}</td><td>${d.target_label}</td><td>${d.user_response}</td><td class="correct-${d.correct}">${d.correct ? "○" : "×"}</td><td>${d.rt ? Math.round(d.rt) : "-"}</td></tr>`;
            });

            document.getElementById('final-container').innerHTML = `
                <div style="text-align: center;">
                    <h3 style="color:#27ae60">✅ データ送信完了</h3>
                    <p>データが正常に保存されました。ご協力ありがとうございました。</p>
                    <div class="participant-info-summary">参加者ID: <strong>${participantId}</strong></div>
                </div>

                <div class="summary-charts">
                    <div class="chart-container"><canvas id="accChart"></canvas></div>
                    <div class="chart-container"><canvas id="rtChart"></canvas></div>
                </div>

                <div class="interpretation-box">
                    <h4>📊 結果の解説</h4>
                    <p><strong>仮説との一致：</strong> ${isHypothesisMet ? "一致しました（期待通りの結果です）" : "一致しませんでした"}</p>
                    <p><strong>解説：</strong> 一般的に、2-Backは1-Backよりも「脳の作業机（ワーキングメモリ）」を多く使います。そのため、仮説では2-Backの方が<strong>正答率が下がり</strong>、<strong>考える時間（反応時間）が長く</strong>なると予想されます。${isHypothesisMet ? "あなたの結果も、脳への負荷が増えたことでパフォーマンスが変化しており、典型的な傾向を示しています。" : "今回は試行数が少ないため、あるいはあなたが2-Backに非常に集中していたため、予想とは異なる結果になった可能性があります。"}</p>
                </div>

                <h4>📋 詳細データ一覧</h4>
                <div style="overflow-x:auto">
                    <table class="results-table">
                        <thead><tr><th>条件</th><th>試行</th><th>文字</th><th>正解</th><th>回答</th><th>正誤</th><th>反応時間(ms)</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
                <div style="text-align:center; margin-top:30px;">
                    <button class="jspsych-btn" onclick="window.close();">画面を閉じる</button>
                </div>
            `;

            new Chart(document.getElementById('accChart'), {
                type: 'bar',
                data: {
                    labels: ['かんたん (1-Back)', 'むずかしい (2-Back)'],
                    datasets: [{ label: '正解率 (%)', data: [stats.acc1, stats.acc2], backgroundColor: ['#81c784', '#e57373'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
            });

            new Chart(document.getElementById('rtChart'), {
                type: 'bar',
                data: {
                    labels: ['かんたん (1-Back)', 'むずかしい (2-Back)'],
                    datasets: [{ label: '反応速度 (ミリ秒)', data: [stats.rt1, stats.rt2], backgroundColor: ['#64b5f6', '#ffb74d'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        const timeline = [
            p_info,
            instr_1back, ready_wait, ...createTrials(sequence1Back, 1, '1-back'),
            instr_2back, ready_wait, ...createTrials(sequence2Back, 2, '2-back'),
            save_and_results
        ];
        
        jsPsych.run(timeline);
    </script>
</body>
</html>
