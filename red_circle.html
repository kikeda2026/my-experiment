<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>jsPsych Experiment</title>
  <!-- jsPsych 7.3.4 CDN -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    /* 全体の背景色を灰色に設定 */
    body {
      background-color: #808080;
      color: white;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* jsPsychのコンテナ全体を背景色に合わせ、中央揃えにする */
    .jspsych-display-element {
      background-color: #808080;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 赤い円のスタイル定義 (直径100px) */
    .red-circle {
      width: 100px;
      height: 100px;
      background-color: #ff0000;
      border-radius: 50%;
      margin: 0 auto;
    }

    /* テキストのスタイル調整 */
    p, h1, h2 {
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
  </style>
</head>
<body>
  <script>
    /**
     * jsPsychの初期化
     */
    const jsPsych = initJsPsych({
      on_finish: function() {
        // 全行程終了時にデータを表示
        jsPsych.data.displayData();
      }
    });

    // タイムラインの作成
    const timeline = [];

    /**
     * 1. 赤い円の表示
     * 仕様: 直径100px、スペースキーで次へ
     */
    const circle_trial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div class="red-circle"></div>',
      choices: [' '], // スペースキーのみ
      prompt: '<p style="margin-top: 30px;">スペースキーを押すと次へ進みます</p>'
    };
    timeline.push(circle_trial);

    /**
     * 2. 終了メッセージの表示
     * 仕様: スペースキーが押されるまで表示
     */
    const end_message_trial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<h1>実験終了です！人生で2つ目のプログラムですね！</h1>',
      choices: [' '], // スペースキーのみ
      prompt: '<p>スペースキーを押してください</p>'
    };
    timeline.push(end_message_trial);

    /**
     * 3. 制作者メッセージの表示
     */
    const credits_trial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<h2>提供：IKEDA\'s Lab</h2>',
      choices: "NO_KEYS", // ここで実験停止（または自動終了）
      trial_duration: 5000 // 5秒間表示して終了
    };
    timeline.push(credits_trial);

    /**
     * 実験の実行
     */
    jsPsych.run(timeline);
  </script>
</body>
</html>
