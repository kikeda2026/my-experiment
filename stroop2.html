<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストループ課題 - jsPsych</title>
    <!-- jsPsych v7.3 ライブラリの読み込み -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
    <style>
        body {
            background-color: #FFFFFF;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            color: #333;
        }
        .stimulus {
            font-size: 60px;
            font-weight: bold;
        }
        .instruction {
            font-size: 20px;
            line-height: 1.6;
            text-align: left;
            display: inline-block;
        }
        .fixation {
            font-size: 60px;
        }
        #message-container {
            padding: 40px;
            text-align: center;
        }
        .status-msg {
            font-size: 1.2em;
            color: #555;
        }
        input[type="text"] {
            font-size: 20px;
            padding: 8px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        // --- 設定エリア ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk7y1dNEaxL_lD9bWz8Ca1bskk6z5GUM11aKuMTQv57zz-2ShBLQ1mwA8ys3PMrVOgBQ/exec";
        
        // グローバル変数
        let participant_id = "";

        /**
         * 指数バックオフを用いたデータ送信
         */
        async function saveData(data, attempt = 0) {
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];

            try {
                // GASへの送信 (CORS回避のため mode: 'no-cors' を使用)
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data),
                    headers: { "Content-Type": "application/json" },
                    mode: 'no-cors'
                });

                updateStatus("送信完了。ブラウザを閉じてください。");
            } catch (error) {
                if (attempt < maxRetries) {
                    const delay = delays[attempt];
                    updateStatus(`送信失敗。${delay/1000}秒後に再試行します... (${attempt + 1}/${maxRetries})`);
                    setTimeout(() => saveData(data, attempt + 1), delay);
                } else {
                    updateStatus("データの送信に失敗しました。接続を確認し、管理者に連絡してください。");
                    console.error("Transmission Failed:", error);
                }
            }
        }

        function updateStatus(msg) {
            const container = document.getElementById('message-container');
            if (container) {
                const statusEl = container.querySelector('.status-msg');
                if (statusEl) statusEl.innerText = msg;
            }
        }

        /**
         * jsPsychの初期化
         */
        const jsPsych = initJsPsych({
            on_finish: function() {
                // 実験終了時のUI
                document.body.innerHTML = `
                    <div id="message-container">
                        <h2>実験終了</h2>
                        <p class="status-msg">データ送信中...</p>
                    </div>
                `;

                // 分析対象のデータ（タスクが 'response' のもの）のみ抽出
                const clean_data = jsPsych.data.get()
                    .filter({ task: 'response' })
                    .ignore('internal_node_id')
                    .values();

                // サーバーへ送信
                saveData(clean_data);
            }
        });

        const timeline = [];

        /**
         * (1) 参加者ID入力画面
         */
        const enter_id_page = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div class="instruction">
                    <p>実験を開始する前に、参加者ID（学籍番号など）を入力してください。</p>
                    <input type="text" id="p_id_input" placeholder="IDを入力">
                </div>
            `,
            choices: ['次へ'],
            on_finish: function(data) {
                const inputVal = document.getElementById('p_id_input').value;
                participant_id = inputVal || "unknown";
                // IDを全データに付与
                jsPsych.data.addProperties({ participant_id: participant_id });
            }
        };
        timeline.push(enter_id_page);

        /**
         * (2) 教示画面
         */
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction">
                    <p><strong>【ストループ課題】</strong></p>
                    <p>表示される文字の「色」をキーボードで答えてください。</p>
                    <ul style="list-style: none; padding: 0;">
                        <li><span style="color: red;">■</span> 赤色の文字なら <strong>'r'</strong></li>
                        <li><span style="color: blue;">■</span> 青色の文字なら <strong>'b'</strong></li>
                        <li><span style="color: green;">■</span> 緑色の文字なら <strong>'g'</strong></li>
                    </ul>
                    <p style="text-align: center; margin-top: 40px;">スペースキーで開始します。</p>
                </div>
            `,
            choices: [' ']
        });

        /**
         * (3) メイン試行
         */
        const stimuli = [
            { text: "赤", color: "red", condition: "congruent", correct_key: "r" },
            { text: "青", color: "blue", condition: "congruent", correct_key: "b" },
            { text: "緑", color: "green", condition: "congruent", correct_key: "g" },
            { text: "赤", color: "blue", condition: "incongruent", correct_key: "b" },
            { text: "赤", color: "green", condition: "incongruent", correct_key: "g" },
            { text: "青", color: "red", condition: "incongruent", correct_key: "r" },
            { text: "青", color: "green", condition: "incongruent", correct_key: "g" },
            { text: "緑", color: "red", condition: "incongruent", correct_key: "r" },
            { text: "緑", color: "blue", condition: "incongruent", correct_key: "b" }
        ];

        const fixation = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="fixation">+</div>',
            choices: "NO_KEYS",
            trial_duration: 500,
            data: { task: 'fixation' }
        };

        const test = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                return `<div class="stimulus" style="color: ${jsPsych.timelineVariable('color')};">
                            ${jsPsych.timelineVariable('text')}
                        </div>`;
            },
            choices: ['r', 'g', 'b'],
            data: {
                task: 'response',
                word: jsPsych.timelineVariable('text'),
                color: jsPsych.timelineVariable('color'),
                condition: jsPsych.timelineVariable('condition'),
                correct_response: jsPsych.timelineVariable('correct_key'),
                timestamp: () => new Date().toISOString() // タイムスタンプを追加
            },
            on_finish: function(data) {
                // 正誤判定の記録
                data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response) ? 1 : 0;
            }
        };

        const post_trial_gap = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '',
            choices: "NO_KEYS",
            trial_duration: 800
        };

        const test_procedure = {
            timeline: [fixation, test, post_trial_gap],
            timeline_variables: stimuli,
            sample: {
                type: 'with-replacement',
                size: 10 
            }
        };

        timeline.push(test_procedure);

        // 実験開始
        jsPsych.run(timeline);

    </script>
</body>
</html>
