<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストループ課題 - データ自動送信版</title>
    <!-- jsPsych v7.3 ライブラリの読み込み -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
    <style>
        body {
            background-color: #FFFFFF;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            color: #333;
        }
        .stimulus {
            font-size: 60px;
            font-weight: bold;
        }
        .instruction {
            font-size: 20px;
            line-height: 1.6;
            text-align: left;
            display: inline-block;
        }
        .fixation {
            font-size: 60px;
        }
        #message-area {
            padding: 20px;
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <script>
        /**
         * 設定項目
         */
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyk7y1dNEaxL_lD9bWz8Ca1bskk6z5GUM11aKuMTQv57zz-2ShBLQ1mwA8ys3PMrVOgBQ/exec";
        const TOTAL_TRIALS = 10;

        /**
         * jsPsychの初期化
         */
        const jsPsych = initJsPsych({
            on_finish: function() {
                saveData();
            }
        });

        const timeline = [];

        /**
         * (1) 参加者IDの入力
         */
        const participant_info = {
            type: jsPsychSurveyText,
            questions: [
                {prompt: "参加者ID（例：学籍番号）を入力してください", name: 'subject_id', required: true}
            ],
            button_label: "次へ",
            on_finish: function(data) {
                // IDとタイムスタンプを全データに付与
                const id = data.response.subject_id;
                const now = new Date();
                const timestamp = now.getFullYear() + "/" + (now.getMonth() + 1) + "/" + now.getDate() + " " + now.getHours() + ":" + now.getMinutes() + ":" + now.getSeconds();
                
                jsPsych.data.addProperties({
                    subject_id: id,
                    timestamp: timestamp
                });
            }
        };
        timeline.push(participant_info);

        /**
         * (2) 教示画面
         */
        const instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction">
                    <p><strong>【ストループ課題】</strong></p>
                    <p>表示される文字の「色」をできるだけ早く正確にキーボードで答えてください。</p>
                    <ul style="list-style: none; padding: 0;">
                        <li><span style="color: red;">■</span> 赤色の文字なら <strong>'r'</strong> キー</li>
                        <li><span style="color: blue;">■</span> 青色の文字なら <strong>'b'</strong> キー</li>
                        <li><span style="color: green;">■</span> 緑色の文字なら <strong>'g'</strong> キー</li>
                    </ul>
                    <p style="text-align: center; margin-top: 40px;">準備ができたらスペースキーを押して開始します。</p>
                </div>
            `,
            choices: [' ']
        };
        timeline.push(instructions);

        /**
         * (3) メイン試行の定義
         */
        const stimuli = [
            { text: "赤", color: "red", condition: "congruent", correct_key: "r" },
            { text: "青", color: "blue", condition: "congruent", correct_key: "b" },
            { text: "緑", color: "green", condition: "congruent", correct_key: "g" },
            { text: "赤", color: "blue", condition: "incongruent", correct_key: "b" },
            { text: "赤", color: "green", condition: "incongruent", correct_key: "g" },
            { text: "青", color: "red", condition: "incongruent", correct_key: "r" },
            { text: "青", color: "green", condition: "incongruent", correct_key: "g" },
            { text: "緑", color: "red", condition: "incongruent", correct_key: "r" },
            { text: "緑", color: "blue", condition: "incongruent", correct_key: "b" }
        ];

        // 注視点
        const fixation = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="fixation">+</div>',
            choices: "NO_KEYS",
            trial_duration: 500,
            data: { task: 'fixation' }
        };

        // 刺激提示
        const test = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                return `<div class="stimulus" style="color: ${jsPsych.timelineVariable('color')};">
                            ${jsPsych.timelineVariable('text')}
                        </div>`;
            },
            choices: ['r', 'g', 'b'],
            data: {
                task: 'response',
                word: jsPsych.timelineVariable('text'),
                color: jsPsych.timelineVariable('color'),
                condition: jsPsych.timelineVariable('condition'),
                correct_response: jsPsych.timelineVariable('correct_key')
            },
            on_finish: function(data) {
                // 正誤判定：空欄にならないよう明示的に true/false を文字列または真偽値で記録
                data.correct = (jsPsych.pluginAPI.compareKeys(data.response, data.correct_response)) ? "true" : "false";
            }
        };

        // ITI
        const post_trial_gap = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '',
            choices: "NO_KEYS",
            trial_duration: 1000,
            data: { task: 'iti' }
        };

        const test_procedure = {
            timeline: [fixation, test, post_trial_gap],
            timeline_variables: stimuli,
            sample: {
                type: 'with-replacement',
                size: TOTAL_TRIALS
            }
        };
        timeline.push(test_procedure);

        /**
         * データの抽出と保存・送信処理
         */
        async function saveData() {
            const display_element = jsPsych.getDisplayElement();
            display_element.innerHTML = '<div id="message-area"><h3>データを送信中...</h3><p>画面を閉じずにそのままお待ちください。</p></div>';

            // 必要な試行データ（task: 'response'）のみ抽出
            const relevant_data = jsPsych.data.get().filter({task: 'response'}).ignore(['task', 'correct_response', 'internal_node_id', 'trial_type', 'trial_index', 'stimulus', 'response']);
            
            // 分析に必要な列を明示的に選択してJSON化
            // subject_id, timestamp, word, color, condition, rt, correct
            const data_to_send = relevant_data.values();
            const csv_content = relevant_data.csv();

            // 送信エラーハンドリング（指数バックオフ）
            const maxRetries = 5;
            let attempt = 0;

            const sendDataWithRetry = async () => {
                try {
                    const response = await fetch(GAS_URL, {
                        method: "POST",
                        mode: "no-cors", // GASへのPOSTは通常no-corsで運用（セキュリティ設定により変わる）
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data_to_send)
                    });

                    // 送信成功時の表示
                    display_element.innerHTML = `
                        <div id="message-area">
                            <h2>実験終了</h2>
                            <p>データは正常に保存されました。ご協力ありがとうございました。</p>
                            <hr>
                            <p style="font-size: 0.9em; color: #666;">（バックアップ用CSVデータ）</p>
                            <textarea style="width:100%; height:200px;">${csv_content}</textarea>
                        </div>
                    `;
                } catch (error) {
                    attempt++;
                    if (attempt <= maxRetries) {
                        const delay = Math.pow(2, attempt - 1) * 1000;
                        setTimeout(sendDataWithRetry, delay);
                    } else {
                        display_element.innerHTML = `
                            <div id="message-area" style="color: red;">
                                <h2>送信エラー</h2>
                                <p>データの自動保存に失敗しました。ネットワーク状況を確認してください。</p>
                                <p>お手数ですが、以下のテキストボックスの内容をすべてコピーして保存してください。</p>
                                <textarea style="width:100%; height:300px; color: black;">${csv_content}</textarea>
                            </div>
                        `;
                    }
                }
            };

            sendDataWithRetry();
        }

        // 実験の実行
        jsPsych.run(timeline);

    </script>
</body>
</html>
