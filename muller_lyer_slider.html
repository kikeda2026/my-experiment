<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Müller-Lyer Illusion Experiment</title>
    <!-- jsPsych 7.3 libs -->
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-canvas-slider-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.2"></script>
    <!-- Chart.js for Feedback -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        /* 全体の背景色を設定 */
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* jsPsychの表示エリア全体を画面中央に固定 */
        .jspsych-display-element {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            padding: 10px;
            box-sizing: border-box;
        }

        /* コンテナのレスポンシブ対応と中央寄せの強化 */
        .jspsych-content-wrapper {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 95%;
            max-width: 700px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* jsPsych標準のコンテント幅制限を解除 */
        .jspsych-content {
            max-width: 100% !important;
            width: 100% !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 試行カウンターのスタイル */
        .trial-counter {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 15px;
            font-family: sans-serif;
            text-align: center;
        }

        /* キャンバス：ブロック要素化と自動マージンで中央配置を確定 */
        canvas {
            border: 2px solid #e2e8f0;
            background-color: #ffffff;
            border-radius: 8px;
            margin: 10px auto !important; /* 左右オートで中央寄せ */
            display: block !important;    /* インライン要素からの脱却 */
            max-width: 100%; 
            height: auto !important;
            box-sizing: border-box;
        }

        /* スライダーコンテナ */
        .jspsych-canvas-slider-response-container {
            width: 100% !important;
            max-width: 500px;
            margin: 20px auto !important;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="range"] {
            width: 100% !important;
        }

        /* ボタンのスタイル */
        .jspsych-btn {
            background-color: #4a90e2 !important;
            border: none !important;
            padding: 12px 32px !important;
            font-weight: bold !important;
            border-radius: 8px !important;
            transition: background-color 0.2s;
            color: white !important;
            margin: 15px auto !important;
            display: inline-block;
        }

        .jspsych-btn:hover {
            background-color: #357abd !important;
        }

        .chart-container {
            width: 100%;
            max-width: 550px;
            margin: 20px auto;
            position: relative;
            /* 小さな画面でもグラフが潰れないように最小高さを確保 */
            min-height: 300px; 
        }

        .final-screen-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        @media (max-width: 600px) {
            .jspsych-content-wrapper {
                padding: 15px;
            }
            h2 {
                font-size: 1.25rem;
            }
            .chart-container {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                sendDataToGAS();
            }
        });

        // 定数設定 (変更不可)
        const STANDARD_LENGTH = 200;
        const SLIDER_MIN = 50;
        const SLIDER_MAX = 350;
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 400;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxHb7JOkkTm6zW6D_WLvjAJrTRPIcfawXZID5VjEDXnbKEI9hfPrl0ywmudUgRiESfhDQ/exec';

        // 図形描画関数 (既存ロジック厳守)
        function drawMullerLyer(ctx, x, y, length, wingLength, angle, isInward) {
            ctx.beginPath();
            ctx.lineWidth = 3; 
            ctx.strokeStyle = '#2d3748';
            
            ctx.moveTo(x - length / 2, y);
            ctx.lineTo(x + length / 2, y);

            const angleRad = angle * Math.PI / 180;
            const direction = isInward ? 1 : -1;
            const wingXOffset = wingLength * Math.cos(angleRad);
            const wingYOffset = wingLength * Math.sin(angleRad);

            // 左側の羽
            ctx.moveTo(x - length / 2, y);
            ctx.lineTo(x - length / 2 + direction * wingXOffset, y - wingYOffset);
            ctx.moveTo(x - length / 2, y);
            ctx.lineTo(x - length / 2 + direction * wingXOffset, y + wingYOffset);

            // 右側の羽
            ctx.moveTo(x + length / 2, y);
            ctx.lineTo(x + length / 2 - direction * wingXOffset, y - wingYOffset);
            ctx.moveTo(x + length / 2, y);
            ctx.lineTo(x + length / 2 - direction * wingXOffset, y + wingYOffset);

            ctx.stroke();
        }

        // 1. 参加者情報入力試行
        const participant_id_trial = {
            type: jsPsychSurveyText,
            questions: [
                {prompt: "参加者IDを入力してください", name: 'subject_id', required: true}
            ],
            button_label: '次へ'
        };

        // 1-2. 使用機材の選択試行
        const device_selection_trial = {
            type: jsPsychSurveyMultiChoice,
            questions: [
                {
                    prompt: "現在、実験に使用している機材を選択してください", 
                    name: 'device', 
                    options: ["パソコン", "スマホ", "タブレット"], 
                    required: true,
                    horizontal: true
                }
            ],
            button_label: '次へ'
        };

        // 刺激条件の作成
        const angles = [15, 75];
        const wingLengths = [20, 50];
        const repetitions = 3;

        let trialParams = [];
        for (let a of angles) {
            for (let w of wingLengths) {
                for (let r = 0; r < repetitions; r++) {
                    trialParams.push({ angle: a, wingLength: w });
                }
            }
        }
        trialParams = jsPsych.randomization.shuffle(trialParams);

        // 2. 教示画面
        const instructions = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div style="text-align: left; width: 100%;">
                    <h2 style="text-align: center;">実験の説明</h2>
                    <p>画面に2本の線が表示されます。</p>
                    <ul style="line-height: 1.8;">
                        <li><strong>上側の線：</strong> 長さが固定されています。</li>
                        <li><strong>下側の線：</strong> スライダーで長さが変わります。</li>
                    </ul>
                    <p>スライダーを左右に動かして、下の線の長さが<strong>上の線と同じ長さに見えるように</strong>調整してください。</p>
                    <p>調整が終わったら「決定」ボタンを押してください。</p>
                </div>
            `,
            choices: ['実験を開始する'],
            button_html: '<button class="jspsych-btn">%choice%</button>'
        };

        // 3. 実験試行 (既存ロジック厳守)
        const trials = trialParams.map((param, index) => {
            const startVal = Math.floor(Math.random() * (300 - 100 + 1)) + 100;

            return {
                type: jsPsychCanvasSliderResponse,
                stimulus: function(canvas) {
                    const ctx = canvas.getContext('2d');
                    const slider = document.getElementById('jspsych-canvas-slider-response-response');
                    const currentVal = slider ? parseInt(slider.value) : startVal;
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawMullerLyer(ctx, CANVAS_WIDTH / 2, 100, STANDARD_LENGTH, param.wingLength, param.angle, true);
                    drawMullerLyer(ctx, CANVAS_WIDTH / 2, 300, currentVal, param.wingLength, param.angle, false);
                },
                canvas_size: [CANVAS_HEIGHT, CANVAS_WIDTH],
                min: SLIDER_MIN,
                max: SLIDER_MAX,
                slider_start: startVal,
                step: 1,
                labels: [],
                button_label: '決定',
                prompt: `<div class="trial-counter">Trial ${index + 1} / ${trialParams.length}</div>`,
                on_load: function() {
                    const slider = document.getElementById('jspsych-canvas-slider-response-response');
                    slider.addEventListener('input', function() {
                        const canvas = document.querySelector('canvas');
                        if (!canvas) return;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        drawMullerLyer(ctx, CANVAS_WIDTH / 2, 100, STANDARD_LENGTH, param.wingLength, param.angle, true);
                        drawMullerLyer(ctx, CANVAS_WIDTH / 2, 300, parseInt(this.value), param.wingLength, param.angle, false);
                    });
                },
                on_finish: function(data) {
                    const subject_id = jsPsych.data.get().filter({trial_type: 'survey-text'}).last(1).values()[0].response.subject_id;
                    const device = jsPsych.data.get().filter({trial_type: 'survey-multi-choice'}).last(1).values()[0].response.device;
                    
                    data.subject_id = subject_id;
                    data.device = device;
                    data.timestamp = new Date().toISOString();
                    data.angle = param.angle;
                    data.wing_length = param.wingLength;
                    data.pse = parseInt(data.response);
                    data.error_amount = data.pse - STANDARD_LENGTH;
                }
            };
        });

        // 4. データ送信関数
        function sendDataToGAS() {
            const display_element = jsPsych.getDisplayElement();
            display_element.innerHTML = `
                <div class="jspsych-content-wrapper">
                    <h2>データ送信中...</h2>
                    <p>サーバーにデータを保存しています。そのままお待ちください。</p>
                    <div class="status-msg" id="status-msg"></div>
                </div>
            `;

            const results = jsPsych.data.get().filter({trial_type: 'canvas-slider-response'}).values();
            const dataToSave = results.map(d => ({
                subject_id: d.subject_id,
                device: d.device,
                timestamp: d.timestamp,
                angle: d.angle,
                wing_length: d.wing_length,
                pse: d.pse,
                error_amount: d.error_amount
            }));

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSave)
            })
            .then(() => {
                showFinalScreen("実験結果のフィードバック", "データの保存が完了しました。あなたの結果は以下の通りです。");
            })
            .catch((error) => {
                showFinalScreen("送信失敗", "データの保存中にエラーが発生しました。: " + error.message);
            });
        }

        function showFinalScreen(title, message) {
            const display_element = jsPsych.getDisplayElement();
            const results = jsPsych.data.get().filter({trial_type: 'canvas-slider-response'}).values();
            const conditions = [
                { angle: 15, wing: 20 }, { angle: 15, wing: 50 },
                { angle: 75, wing: 20 }, { angle: 75, wing: 50 }
            ];
            const means = conditions.map(c => {
                const trials = results.filter(r => r.angle === c.angle && r.wing_length === c.wing);
                const sum = trials.reduce((acc, curr) => acc + curr.error_amount, 0);
                return trials.length > 0 ? (sum / trials.length).toFixed(2) : 0;
            });
            const labels = conditions.map(c => `${c.angle}° / ${c.wing}px`);

            display_element.innerHTML = `
                <div class="jspsych-content-wrapper" style="max-width: 800px; margin: auto;">
                    <div class="final-screen-container">
                        <h2 style="margin-bottom: 10px;">${title}</h2>
                        <p style="margin-bottom: 20px;">${message}</p>
                        <div class="chart-container">
                            <canvas id="feedbackChart"></canvas>
                        </div>
                        <div style="text-align: left; font-size: 0.85rem; color: #4a5568; margin-top: 15px; width: 100%;">
                            <p><strong>解説:</strong> 縦軸は錯覚量です。正の数値が大きいほど、比較刺激を短く感じ、長く調整したことを意味します。</p>
                        </div>
                        <p style="color: #718096; margin-top: 20px;">ブラウザを閉じて終了してください。</p>
                    </div>
                </div>
            `;

            const contentNode = display_element.querySelector('.jspsych-content-wrapper').parentElement;
            if (contentNode && contentNode.classList.contains('jspsych-content')) {
                contentNode.style.background = 'transparent';
                contentNode.style.boxShadow = 'none';
                contentNode.style.padding = '0';
            }

            const canvasElement = document.getElementById('feedbackChart');
            if (canvasElement) {
                const ctx = canvasElement.getContext('2d');
                // スマホでも見やすいようにフォントサイズを動的に調整
                const isMobile = window.innerWidth < 600;
                const fontSize = isMobile ? 10 : 12;

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '平均錯覚量 (px)',
                            data: means,
                            backgroundColor: 'rgba(74, 144, 226, 0.7)',
                            borderColor: '#2d3748',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false, // コンテナのmin-heightに合わせる
                        scales: {
                            y: { 
                                beginAtZero: true,
                                ticks: { font: { size: fontSize } }
                            },
                            x: {
                                ticks: { font: { size: fontSize } }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: { font: { size: fontSize } }
                            }
                        }
                    }
                });
            }
        }

        const timeline = [participant_id_trial, device_selection_trial, instructions, ...trials];
        jsPsych.run(timeline);

    </script>
</body>
</html>
